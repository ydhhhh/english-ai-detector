[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "english-ai-detector"
version = "2.0.0"
description = "Local calibrated English AI text detection and exploratory source rankings"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "third_party/LICENSE-MIT-legacy.txt"]
dependencies = [
    "numpy==2.3.5",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "torch>=2.8,<3",
    "transformers==5.20.1",
    "tokenizers==0.23.3",
    "huggingface-hub==2.2.0",
    "safetensors==0.8.0",
    "pyarrow==26.0.0",
    "langid==1.1.6",
    "regex==2026.9.29",
    "typer==0.27.3",
    "threadpoolctl==3.7.0"
]

[project.scripts]
english-ai-detector = "english_ai_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["english_ai_detector*", "experiments*"]

[tool.setuptools.package-data]
english_ai_detector = ["web/*.html", "compatibility_manifest.json"]
